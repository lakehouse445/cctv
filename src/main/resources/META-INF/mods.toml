modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
#issueTrackerURL=""

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
#logoFile="cctv.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="computercraft"
    mandatory=true
    versionRange="${cc_version_range}"
    ordering="AFTER"
    side="BOTH"

# Simple Voice Chat — optional; microphones need it, everything else works without.
[[dependencies.${mod_id}]]
    modId="voicechat"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
