buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// Mixin: the microphones tap ServerLevel.levelEvent, which has no Forge hook.
apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, 'cctv.refmap.json'
    config 'cctv.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    copyIdeResources = true

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Runtime libraries: on the compile classpath like implementation, and handed
// to ModLauncher through the minecraft_classpath token so dev runs see them.
configurations {
    library
    implementation.extendsFrom library
}

minecraft.runs.configureEach {
    lazyToken('minecraft_classpath') {
        configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
    }
    // Dev runtime uses official names while the refmap speaks SRG; translate.
    property 'mixin.env.remapRefMap', 'true'
    property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
    args '-mixin.config=cctv.mixins.json'
}

repositories {
    maven {
        name = 'SquidDev'
        url = 'https://maven.squiddev.cc'
        content {
            includeGroup 'cc.tweaked'
        }
    }
    maven {
        name = 'henkelmax'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup 'de.maxhenkel.voicechat'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    mavenCentral()
}

// Embeds the MP4 encoder inside the mod jar.
jarJar.enable()

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // CC:Tweaked — full jar on the compile classpath too: the capture card reads
    // monitor terminals through internal classes (MonitorBlockEntity, Terminal).
    compileOnly fg.deobf("cc.tweaked:cc-tweaked-${minecraft_version}-core-api:${cc_version}")
    compileOnly fg.deobf("cc.tweaked:cc-tweaked-${minecraft_version}-forge-api:${cc_version}")
    implementation fg.deobf("cc.tweaked:cc-tweaked-${minecraft_version}-forge:${cc_version}")

    // Simple Voice Chat plugin API — plain Java library, optional at runtime.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    // The full Simple Voice Chat mod in the dev client, so microphones hear
    // real voices there; never a dependency of the shipped jar.
    runtimeOnly fg.deobf("maven.modrinth:simple-voice-chat:forge-${minecraft_version}-${voicechat_version}")

    // JCodec: pure-Java H.264/MP4 encoder for capture card exports, shipped
    // inside the jar via jarJar. The library configuration puts it on the
    // dev-runtime classpath, where plain implementation deps never arrive.
    // Core jar only: jcodec-javase shares its module name and the two
    // collide under ModLauncher, so the AWT glue lives in our exporter.
    library "org.jcodec:jcodec:0.2.5"
    jarJar(group: 'org.jcodec', name: 'jcodec', version: '[0.2.5,0.3)') {
        jarJar.pin(it, '0.2.5')
    }

    // JOrbis: pure-Java Vorbis decode for the microphones' world-sound
    // pickup. The dedicated server ships no audio stack at all. The
    // soundlibs bundle carries both the jorbis and jogg classes.
    library "com.googlecode.soundlibs:jorbis:0.0.17.4"
    jarJar(group: 'com.googlecode.soundlibs', name: 'jorbis', version: '[0.0.17.4,0.1)') {
        jarJar.pin(it, '0.0.17.4')
    }

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// Production loads mixin configs from the jar manifest; stamp both jars.
tasks.named('jar', Jar).configure {
    manifest.attributes 'MixinConfigs': 'cctv.mixins.json'
}
tasks.named('jarJar', Jar).configure {
    manifest.attributes 'MixinConfigs': 'cctv.mixins.json'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            cc_version_range: cc_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
